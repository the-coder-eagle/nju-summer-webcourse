name: Build X64 Runtime Artifact

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          platforms: linux/amd64
          tags: football-backend:amd64
          load: true

      - name: Build frontend image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/frontend.Dockerfile
          platforms: linux/amd64
          tags: football-frontend:amd64
          load: true

      - name: Copy demo database
        run: |
          cp infra/football-demo.sqlite football-demo.sqlite
          ls -lh football-demo.sqlite

      - name: Package artifact
        run: |
          docker save football-backend:amd64 football-frontend:amd64 -o images.tar
          cp infra/compose.yaml ./docker-compose.yml
          cat > README-RUNTIME.txt << 'EOF'
          ================================================================================
            世界杯/苏超赛事信息与互动预测平台 — X64 运行产物包
          ================================================================================

          包含文件：
            images.tar            两个 Docker 镜像（football-backend:amd64 / football-frontend:amd64）
            docker-compose.yml    一键启动编排（端口 3000 / 7001，含健康检查与数据卷）
            football-demo.sqlite  预置演示数据的数据库（12 球队 / 40 比赛 / 积分榜 / 淘汰赛图）

          前置要求：Docker Engine（支持 linux/amd64）

          【启动步骤】
            1) tar xzf webdev-football-amd64.tar.gz
            2) docker load -i images.tar
            3) docker compose -f docker-compose.yml up -d
            4) 访问 http://localhost:3000

          【健康检查】
            后端：http://localhost:7001/api/health
            前端：http://localhost:3000/api/health

          【停止】
            docker compose -f docker-compose.yml down
          ================================================================================
          EOF
          tar czf webdev-football-amd64.tar.gz images.tar docker-compose.yml football-demo.sqlite README-RUNTIME.txt
          ls -lh webdev-football-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdev-football-amd64
          path: webdev-football-amd64.tar.gz
